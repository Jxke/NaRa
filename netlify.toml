[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "25"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "https://nara-ai.netlify.app/*"
  to = "https://nara.design/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nara-ai.netlify.app/*"
  to = "https://nara.design/:splat"
  status = 301
  force = true
